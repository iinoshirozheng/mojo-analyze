name: Research CSVAgg Span Cost Mojo 1.0 vs 1.1

on:
  push:
    branches: [main]
    paths:
      - 'experiments/csvagg_scan_access/run_version_bench.py'
      - '.github/workflows/research-csvagg-scan-access-version.yml'
  workflow_dispatch:

jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          environments: default

      - name: Record toolchains
        run: |
          echo '=== Mojo 1.0 workspace lock ==='
          pixi run mojo --version
          echo '=== Mojo 1.1 exact temporary environment ==='
          pixi exec \
            -c https://conda.modular.com/max \
            -c conda-forge \
            --spec 'mojo=1.1.0' \
            mojo --version
          clang --version | head -1
          uname -a

      - name: Prepare Category-D corpus
        run: pixi run prepare-data

      - name: Build Mojo 1.0, Mojo 1.1, and C scanner variants
        run: |
          mkdir -p /tmp/csvagg-scan-access-version
          pixi run mojo build \
            experiments/csvagg_scan_access/csvagg_scan_access.mojo \
            -o /tmp/csvagg-scan-access-version/scan-access-mojo-10
          pixi exec \
            -c https://conda.modular.com/max \
            -c conda-forge \
            --spec 'mojo=1.1.0' \
            mojo build experiments/csvagg_scan_access/csvagg_scan_access.mojo \
            -o /tmp/csvagg-scan-access-version/scan-access-mojo-11
          clang -O3 experiments/csvagg_scan_scope/csvagg_scan_scope.c \
            -o /tmp/csvagg-scan-access-version/scan-scope-c

      - name: Emit optimized assembly
        run: |
          pixi run mojo build --emit asm \
            experiments/csvagg_scan_access/csvagg_scan_access.mojo \
            -o /tmp/csvagg-scan-access-version/scan-access-mojo-10-${{ matrix.arch }}.s
          pixi exec \
            -c https://conda.modular.com/max \
            -c conda-forge \
            --spec 'mojo=1.1.0' \
            mojo build --emit asm experiments/csvagg_scan_access/csvagg_scan_access.mojo \
            -o /tmp/csvagg-scan-access-version/scan-access-mojo-11-${{ matrix.arch }}.s
          clang -O3 -S experiments/csvagg_scan_scope/csvagg_scan_scope.c \
            -o /tmp/csvagg-scan-access-version/scan-scope-c-${{ matrix.arch }}.s
          wc -l /tmp/csvagg-scan-access-version/*-${{ matrix.arch }}.s
          echo '=== bounds diagnostic strings ==='
          for f in /tmp/csvagg-scan-access-version/scan-access-mojo-*-${{ matrix.arch }}.s; do
            echo "$f"
            grep -c 'is out of bounds' "$f" || true
          done
          echo '=== architecture bounds-branch mnemonic counts (whole assembly; diagnostic only) ==='
          if [ '${{ matrix.arch }}' = 'x86_64' ]; then
            for f in /tmp/csvagg-scan-access-version/scan-access-mojo-*-${{ matrix.arch }}.s; do
              printf '%s jae=' "$f"
              grep -Eoc '[[:space:]]jae[[:space:]]' "$f" || true
            done
          else
            for f in /tmp/csvagg-scan-access-version/scan-access-mojo-*-${{ matrix.arch }}.s; do
              printf '%s b.hs=' "$f"
              grep -Eoc '[[:space:]]b\.hs[[:space:]]' "$f" || true
            done
          fi

      - name: Run checksum gate plus 2 warmups and 7 trials
        run: |
          python experiments/csvagg_scan_access/run_version_bench.py \
            --arch '${{ matrix.arch }}' \
            --mojo10 /tmp/csvagg-scan-access-version/scan-access-mojo-10 \
            --mojo11 /tmp/csvagg-scan-access-version/scan-access-mojo-11 \
            --cbin /tmp/csvagg-scan-access-version/scan-scope-c \
            --out-dir /tmp/csvagg-scan-access-version

      - uses: actions/upload-artifact@v7
        with:
          name: csvagg-scan-access-version-${{ matrix.arch }}
          path: |
            /tmp/csvagg-scan-access-version/csvagg-scan-access-version-${{ matrix.arch }}.json
            /tmp/csvagg-scan-access-version/scan-access-mojo-10-${{ matrix.arch }}.s
            /tmp/csvagg-scan-access-version/scan-access-mojo-11-${{ matrix.arch }}.s
            /tmp/csvagg-scan-access-version/scan-scope-c-${{ matrix.arch }}.s
