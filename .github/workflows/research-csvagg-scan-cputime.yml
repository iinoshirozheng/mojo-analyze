name: Research CSVAgg arm64 scanner child CPU time

on:
  push:
    branches: [main]
    paths:
      - 'experiments/csvagg_scan_access/run_cpu_time_bench.py'
      - '.github/workflows/research-csvagg-scan-cputime.yml'
  workflow_dispatch:

jobs:
  bench:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          environments: default

      - name: Record host and toolchains
        run: |
          echo '=== Mojo 1.2 Sep-21 nightly exact temporary environment ==='
          pixi exec -c https://conda.modular.com/max-nightly -c conda-forge \
            --spec 'mojo=1.2.0.dev2026092105' mojo --version
          clang --version | head -1
          uname -a
          lscpu
          taskset -pc $$

      - name: Prepare Category-D corpus
        run: pixi run prepare-data

      - name: Build exact scanner binaries
        run: |
          mkdir -p /tmp/csvagg-scan-cputime
          pixi exec -c https://conda.modular.com/max-nightly -c conda-forge \
            --spec 'mojo=1.2.0.dev2026092105' \
            mojo build experiments/csvagg_scan_access/csvagg_scan_access.mojo \
            -o /tmp/csvagg-scan-cputime/scan-access-mojo-12
          clang -O3 experiments/csvagg_scan_scope/csvagg_scan_scope.c \
            -o /tmp/csvagg-scan-cputime/scan-scope-c
          sha256sum \
            /tmp/csvagg-scan-cputime/scan-access-mojo-12 \
            /tmp/csvagg-scan-cputime/scan-scope-c

      - name: Run checksum gate plus 2 warmups and 30 CPU-time-interleaved trials
        run: |
          python experiments/csvagg_scan_access/run_cpu_time_bench.py \
            --arch arm64 \
            --mojo12 /tmp/csvagg-scan-cputime/scan-access-mojo-12 \
            --cbin /tmp/csvagg-scan-cputime/scan-scope-c \
            --out-dir /tmp/csvagg-scan-cputime \
            --trials 30

      - uses: actions/upload-artifact@v7
        with:
          name: csvagg-scan-cputime-arm64
          path: /tmp/csvagg-scan-cputime/csvagg-scan-cputime-arm64.json
