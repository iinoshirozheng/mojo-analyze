name: Benchmark

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # macOS numbers in ANALYSIS.md come from one controlled dev machine (see its
  # Methodology section); this job exists to actually run the same suite on
  # Linux, since pixi.toml pins linux-64/linux-aarch64 but every published
  # number so far was arm64 macOS only. GitHub-hosted runners are shared and
  # noisier than a dedicated machine, so treat these as a second reference
  # point, not a replacement for the primary numbers.
  bench-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          environments: default

      - uses: dtolnay/rust-toolchain@stable

      - run: pixi run build
      - run: pixi run build-rust
      - run: pixi run build-c
      - run: pixi run prepare-corpus
      - run: pixi run prepare-data
      - run: pixi run prepare-events
      - run: pixi run bench --trials 3 --warmup 1

      - uses: actions/upload-artifact@v7
        with:
          name: results-linux-${{ matrix.arch }}
          path: results/results.json

  sieve-rust-unsafe:
    # Focused causal experiment: everything is identical to the canonical Rust
    # sieve except the hot marking write uses get_unchecked_mut. Keep this in a
    # separate job so its 7-trial result is available without waiting for the
    # much slower full cross-language suite.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --manifest-path rust/Cargo.toml
      - run: python scripts/bench_sieve_rust_unsafe.py --trials 7 --warmup 2 --arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: sieve-rust-unsafe-${{ matrix.arch }}
          path: results/experiments/sieve-rust-unsafe-${{ matrix.arch }}.json

  sieve-mojo-nightly-diff:
    # One-off compiler differential prompted by the 2026-09-07 official nightly
    # and the hlcf.if -> hlcf.elif lowering migration. The source and workload
    # are identical; only the Mojo compiler/toolchain revision changes.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          environments: default

      - name: Build stable and Sep-7 nightly Sieve
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/experiments
          pixi run mojo build benchmarks/sieve/sieve.mojo -o dist/experiments/sieve-mojo-stable
          pixi run mojo build --emit asm benchmarks/sieve/sieve.mojo -o dist/experiments/sieve-mojo-stable.s
          pixi exec \
            -c https://conda.modular.com/max-nightly \
            -c conda-forge \
            -s mojo=1.1.0.dev2026090705 \
            -- mojo build benchmarks/sieve/sieve.mojo -o dist/experiments/sieve-mojo-nightly
          pixi exec \
            -c https://conda.modular.com/max-nightly \
            -c conda-forge \
            -s mojo=1.1.0.dev2026090705 \
            -- mojo build --emit asm benchmarks/sieve/sieve.mojo -o dist/experiments/sieve-mojo-nightly.s

      - name: Benchmark stable vs nightly
        shell: bash
        run: |
          set -euo pipefail
          STABLE_VERSION="$(pixi run mojo --version | head -n1)"
          NIGHTLY_VERSION="$(pixi exec -c https://conda.modular.com/max-nightly -c conda-forge -s mojo=1.1.0.dev2026090705 -- mojo --version | head -n1)"
          python scripts/bench_sieve_mojo_nightly.py \
            --trials 7 --warmup 2 --arch "${{ matrix.arch }}" \
            --stable-version "$STABLE_VERSION" \
            --nightly-version "$NIGHTLY_VERSION"

      - uses: actions/upload-artifact@v7
        with:
          name: sieve-mojo-nightly-20260907-${{ matrix.arch }}
          path: |
            results/experiments/sieve-mojo-nightly-20260907-${{ matrix.arch }}.json
            dist/experiments/sieve-mojo-stable.s
            dist/experiments/sieve-mojo-nightly.s
