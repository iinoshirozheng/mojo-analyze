name: Benchmark

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # macOS numbers in ANALYSIS.md come from one controlled dev machine (see its
  # Methodology section); this job exists to actually run the same suite on
  # Linux, since pixi.toml pins linux-64/linux-aarch64 but every published
  # number so far was arm64 macOS only. GitHub-hosted runners are shared and
  # noisier than a dedicated machine, so treat these as a second reference
  # point, not a replacement for the primary numbers.
  bench-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          environments: default

      - uses: dtolnay/rust-toolchain@stable

      - run: pixi run build
      - run: pixi run build-rust
      - run: python scripts/bench_sieve_rust_unsafe.py --trials 7 --warmup 2 --arch ${{ matrix.arch }}
      - run: pixi run build-c
      - run: pixi run prepare-corpus
      - run: pixi run prepare-data
      - run: pixi run prepare-events
      - run: pixi run bench --trials 3 --warmup 1

      - uses: actions/upload-artifact@v7
        with:
          name: results-linux-${{ matrix.arch }}
          path: results/results.json

      - uses: actions/upload-artifact@v7
        with:
          name: sieve-rust-unsafe-${{ matrix.arch }}
          path: results/experiments/sieve-rust-unsafe-${{ matrix.arch }}.json
