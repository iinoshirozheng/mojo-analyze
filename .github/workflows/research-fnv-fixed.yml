name: Research FNV Fixed

on:
  push:
    branches: [main]
    paths:
      - 'experiments/fnv_fixed/**'
      - '.github/workflows/research-fnv-fixed.yml'
  workflow_dispatch:

jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          environments: default
      - name: Record toolchains
        run: |
          pixi run mojo --version
          clang --version | head -1
          uname -a
      - name: Build focused variants
        run: |
          mkdir -p /tmp/fnv-fixed
          pixi run mojo build experiments/fnv_fixed/fnv.mojo -o /tmp/fnv-fixed/fnv-mojo
          clang -O3 experiments/fnv_fixed/fnv.c -o /tmp/fnv-fixed/fnv-c
      - name: Run 2 warmups + 7 measured trials
        run: python experiments/fnv_fixed/run_bench.py /tmp/fnv-fixed/fnv-mojo /tmp/fnv-fixed/fnv-c /tmp/fnv-fixed/fnv-result-${{ matrix.arch }}.json
      - name: Emit optimized assembly for the exact workload
        run: |
          pixi run mojo build --emit asm experiments/fnv_fixed/fnv.mojo -o /tmp/fnv-fixed/fnv-mojo-${{ matrix.arch }}.s
          clang -O3 -S experiments/fnv_fixed/fnv.c -o /tmp/fnv-fixed/fnv-c-${{ matrix.arch }}.s
          echo '=== assembly line counts ==='
          wc -l /tmp/fnv-fixed/fnv-*-${{ matrix.arch }}.s
          echo '=== multiply / branch opcode counts ==='
          python - <<'PY'
          import pathlib, re
          root = pathlib.Path('/tmp/fnv-fixed')
          arch = '${{ matrix.arch }}'
          for impl in ('mojo', 'c'):
              p = root / f'fnv-{impl}-{arch}.s'
              text = p.read_text(errors='replace')
              opcodes = {
                  'imul': len(re.findall(r'\bimul[a-z]*\b', text)),
                  'mul': len(re.findall(r'\bmul\b', text)),
                  'xor': len(re.findall(r'\bxor[a-z]*\b', text)),
                  'eor': len(re.findall(r'\beor\b', text)),
                  'cmp': len(re.findall(r'\bcmp[a-z]*\b', text)),
                  'conditional_branch': len(re.findall(r'\b(?:j(?:ne|nz|e|z|b|be|a|ae|l|le|g|ge)|b\.(?:ne|eq|lo|ls|hi|hs|lt|le|gt|ge))\b', text)),
              }
              print(impl, opcodes)
          PY
          echo '=== x86 FNV-prime references, if immediate ==='
          grep -n -E '1099511628211|100000001[Bb]3' /tmp/fnv-fixed/fnv-*-${{ matrix.arch }}.s || true
          echo '=== candidate hash arithmetic context ==='
          grep -n -E -C 3 '\b(imul|mul|eor|xorq|xor)\b' /tmp/fnv-fixed/fnv-*-${{ matrix.arch }}.s | head -240 || true
      - uses: actions/upload-artifact@v7
        with:
          name: fnv-fixed-${{ matrix.arch }}
          path: |
            /tmp/fnv-fixed/fnv-result-${{ matrix.arch }}.json
            /tmp/fnv-fixed/fnv-mojo-${{ matrix.arch }}.s
            /tmp/fnv-fixed/fnv-c-${{ matrix.arch }}.s
